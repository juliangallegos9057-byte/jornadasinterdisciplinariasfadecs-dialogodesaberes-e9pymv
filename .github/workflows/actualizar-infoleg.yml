name: Sincronizar Base InfoLEG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias necesarias
        run: pip install pandas requests google-api-python-client google-auth

      - name: Descargar, filtrar CSV y subir respaldo a Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL }}
        run: python scripts/procesar_infoleg.py

      - name: Guardar archivos livianos en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: actualizar base legislativa InfoLEG y respaldo"
          git push
